{{- if .Values.rsync.enabled -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "pv-migrate.fullname" . }}-rsync
  namespace: {{ .Values.rsync.namespace }}
  labels:
    app.kubernetes.io/component: rsync
    {{- include "pv-migrate.labels" . | nindent 4 }}
    {{- with .Values.rsync.jobLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.rsync.jobAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  backoffLimit: {{ .Values.rsync.backoffLimit }}
  {{- with .Values.rsync.ttlSecondsAfterFinished }}
  ttlSecondsAfterFinished: {{ . }}
  {{- end }}
  template:
    metadata:
      {{- with .Values.rsync.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app.kubernetes.io/component: rsync
        {{- include "pv-migrate.selectorLabels" . | nindent 8 }}
        {{- with .Values.rsync.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.rsync.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "pv-migrate.rsync.serviceAccountName" . }}
      restartPolicy: {{ .Values.rsync.restartPolicy }}
      securityContext:
        {{- toYaml .Values.rsync.podSecurityContext | nindent 8 }}
      containers:
        - name: rsync
          command:
            - sh
            - -c
            - |
              export HOME=$(awk -F: -v uid="$(id -u)" '$3==uid{print $6}' /etc/passwd)
              n=0
              rc=1
              retries={{ .Values.rsync.maxRetries }}
              attempts=$((retries+1))
              period={{ .Values.rsync.retryPeriodSeconds }}
              {{ if .Values.rsync.privateKeyMount -}}
              privateKeyFilename=$(basename "{{ .Values.rsync.privateKeyMountPath }}")
              mkdir -p "$HOME/.ssh"
              chmod 700 "$HOME/.ssh"
              cp "{{ .Values.rsync.privateKeyMountPath }}" "$HOME/.ssh/"
              chmod 400 "$HOME/.ssh/$privateKeyFilename"
              {{- end }}
              while [ "$n" -le "$retries" ]
              do
                # Traced so the log shows the exact data mover invocation, and
                # nothing else: a fully traced script buries the two lines of
                # evidence a reader needs under its own bookkeeping.
                set -x
                {{ required ".Values.rsync.command is required!" .Values.rsync.command }} {{ .Values.rsync.extraArgs }}
                { rc=$?; set +x; } 2>/dev/null
                [ "$rc" -eq 0 ] && break
                # Vanished source files are expected on a volume that is still being
                # written to, and retrying cannot bring them back. The echoed line is
                # what the client looks for to report the skipped files, since on a
                # successful job it never sees the raw log.
                if [ "$rc" -eq 24 ]; then
                  echo "pv-migrate: some source files vanished during the transfer; treated as success"
                  rc=0
                  break
                fi
                # A usage error is deterministic, so retrying only burns the budget.
                [ "$rc" -eq 1 ] && break
                n=$((n+1))
                [ "$n" -gt "$retries" ] && break
                echo "rsync attempt $n/$attempts failed, waiting $period seconds before trying again"
                sleep $period
              done

              if [ $rc -ne 0 ]; then
                echo "rsync job failed with exit code $rc"
              fi
              exit $rc
          securityContext:
            {{- toYaml .Values.rsync.securityContext | nindent 12 }}
          image: "{{ .Values.rsync.image.repository }}:{{ .Values.rsync.image.tag }}"
          imagePullPolicy: {{ .Values.rsync.image.pullPolicy }}
          resources:
            {{- toYaml .Values.rsync.resources | nindent 12 }}
          volumeMounts:
            {{- range $index, $mount := .Values.rsync.pvcMounts }}
            - mountPath: {{ $mount.mountPath }}
              name: vol-{{ $index }}
              readOnly: {{ default false $mount.readOnly }}
            {{- end }}
            {{- if .Values.rsync.privateKeyMount }}
            - mountPath: {{ .Values.rsync.privateKeyMountPath }}
              name: private-key
              subPath: privateKey
            {{- end }}
      {{- with .Values.rsync.nodeName }}
      nodeName: {{ . }}
      {{- end }}
      {{- with .Values.rsync.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.rsync.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.rsync.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        {{- range $index, $mount := .Values.rsync.pvcMounts }}
        - name: vol-{{ $index }}
          persistentVolumeClaim:
            claimName: {{ required ".Values.rsync.pvcMounts[*].pvcName is required!" $mount.name }}
            readOnly: {{ default false $mount.readOnly }}
        {{- end }}
        {{- if .Values.rsync.privateKeyMount }}
        - name: private-key
          secret:
            secretName: {{ include "pv-migrate.fullname" . }}-rsync
            defaultMode: 0400
        {{- end }}
{{- end }}
