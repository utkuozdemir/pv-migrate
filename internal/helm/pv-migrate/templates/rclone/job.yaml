{{- if .Values.rclone.enabled -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "pv-migrate.fullname" . }}-rclone
  namespace: {{ .Values.rclone.namespace }}
  labels:
    app.kubernetes.io/component: rclone
    {{- include "pv-migrate.labels" . | nindent 4 }}
    {{- with .Values.rclone.jobLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.rclone.jobAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  backoffLimit: {{ .Values.rclone.backoffLimit }}
  {{- with .Values.rclone.ttlSecondsAfterFinished }}
  ttlSecondsAfterFinished: {{ . }}
  {{- end }}
  template:
    metadata:
      {{- with .Values.rclone.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app.kubernetes.io/component: rclone
        {{- include "pv-migrate.selectorLabels" . | nindent 8 }}
        {{- with .Values.rclone.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.rclone.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "pv-migrate.rclone.serviceAccountName" . }}
      restartPolicy: {{ .Values.rclone.restartPolicy }}
      securityContext:
        {{- toYaml .Values.rclone.podSecurityContext | nindent 8 }}
      containers:
        - name: rclone
          command:
            - sh
            - -c
            - |
              n=0
              rc=1
              retries={{ .Values.rclone.maxRetries }}
              attempts=$((retries+1))
              period={{ .Values.rclone.retryPeriodSeconds }}
              failure="rclone job"
              while [ "$n" -le "$retries" ]
              do
                set -x
                {{ required ".Values.rclone.command is required!" .Values.rclone.command }} {{ .Values.rclone.extraArgs }}
                { rc=$?; set +x; } 2>/dev/null
                [ "$rc" -eq 0 ] && break
                n=$((n+1))
                [ "$n" -gt "$retries" ] && break
                echo "rclone attempt $n/$attempts failed, waiting $period seconds before trying again"
                sleep $period
              done
              {{- if and (eq .Values.rclone.posixMetadataDirection "backup") .Values.rclone.posixMetadataRemotePath }}

              if [ $rc -eq 0 ]; then
                posix_file="${TMPDIR:-/tmp}/pv-migrate-posix-$$.gz"
                rm -f "$posix_file"
                posixmeta save --mount-root /data "$PV_MIGRATE_LOCAL_PATH" "$posix_file"
                posix_rc=$?
                if [ $posix_rc -ne 0 ]; then
                  failure="posix metadata capture"
                  rc=$posix_rc
                else
                  n=0
                  while [ "$n" -le "$retries" ]
                  do
                    rclone --config "$PV_MIGRATE_CONFIG_PATH" copyto "$posix_file" "$PV_MIGRATE_POSIX_REMOTE_PATH"
                    posix_rc=$?
                    [ "$posix_rc" -eq 0 ] && break
                    n=$((n+1))
                    [ "$n" -gt "$retries" ] && break
                    echo "posix metadata upload attempt $n/$attempts failed, waiting $period seconds before trying again"
                    sleep $period
                  done
                  if [ $posix_rc -ne 0 ]; then
                    failure="posix metadata upload"
                    rc=$posix_rc
                  fi
                fi
                rm -f "$posix_file"
              fi
              {{- end }}
              {{- if and (eq .Values.rclone.posixMetadataDirection "restore") .Values.rclone.posixMetadataRemotePath }}

              if [ $rc -eq 0 ]; then
                posix_file="${TMPDIR:-/tmp}/pv-migrate-posix-$$.gz"
                posix_missing=0
                n=0
                while [ "$n" -le "$retries" ]
                do
                  rm -f "$posix_file"
                  rclone --config "$PV_MIGRATE_CONFIG_PATH" copyto "$PV_MIGRATE_POSIX_REMOTE_PATH" "$posix_file"
                  posix_rc=$?
                  if { [ "$posix_rc" -eq 0 ] && [ ! -e "$posix_file" ]; } || [ "$posix_rc" -eq 3 ] || [ "$posix_rc" -eq 4 ]; then
                    echo "pv-migrate: posix metadata not found, permissions and ownership were not restored"
                    posix_missing=1
                    posix_rc=0
                    break
                  fi
                  [ "$posix_rc" -eq 0 ] && break
                  n=$((n+1))
                  [ "$n" -gt "$retries" ] && break
                  echo "posix metadata download attempt $n/$attempts failed, waiting $period seconds before trying again"
                  sleep $period
                done
                if [ $posix_rc -ne 0 ]; then
                  failure="posix metadata download"
                  rc=$posix_rc
                elif [ "$posix_missing" -eq 0 ]; then
                  posixmeta apply{{- if .Values.rclone.posixMetadataNoChown }} --no-chown{{- end }}{{- if .Values.rclone.posixMetadataNonRoot }} --non-root{{- end }} --mount-root /data "$PV_MIGRATE_LOCAL_PATH" "$posix_file"
                  posix_rc=$?
                  if [ $posix_rc -ne 0 ]; then
                    failure="posix metadata apply"
                    rc=$posix_rc
                  fi
                fi
                rm -f "$posix_file"
              fi
              {{- end }}
              {{- if .Values.rclone.metadataBase64 }}

              if [ $rc -eq 0 ]; then
                echo '{{ .Values.rclone.metadataBase64 }}' | base64 -d > /tmp/metadata.yaml
                n=0
                while [ "$n" -le "$retries" ]
                do
                  rclone --config "$PV_MIGRATE_CONFIG_PATH" copyto /tmp/metadata.yaml "$PV_MIGRATE_METADATA_REMOTE_PATH"
                  metadata_rc=$?
                  [ "$metadata_rc" -eq 0 ] && break
                  n=$((n+1))
                  [ "$n" -gt "$retries" ] && break
                  echo "metadata upload attempt $n/$attempts failed, waiting $period seconds before trying again"
                  sleep $period
                done
                # The metadata object is how a restore finds this backup, so a backup
                # without it is not a backup. Its failure becomes the job's failure.
                if [ $metadata_rc -ne 0 ]; then
                  echo "data synced OK, but the metadata upload failed, so restore would not find this backup"
                  failure="metadata upload"
                  rc=$metadata_rc
                fi
              fi
              {{- end }}

              if [ $rc -ne 0 ]; then
                echo "$failure failed with exit code $rc"
              fi
              exit $rc
          {{- if or .Values.rclone.metadataBase64 .Values.rclone.posixMetadataRemotePath }}
          # The remote path and the config path reach the script as environment
          # variables rather than being templated into it. Rendering them inline
          # would put them inside shell double quotes, where a command
          # substitution still runs, so a user-supplied path would be shell input.
          env:
            - name: PV_MIGRATE_CONFIG_PATH
              value: {{ .Values.rclone.configMountPath | quote }}
            {{- if .Values.rclone.metadataBase64 }}
            - name: PV_MIGRATE_METADATA_REMOTE_PATH
              value: {{ .Values.rclone.metadataRemotePath | quote }}
            {{- end }}
            {{- if .Values.rclone.posixMetadataRemotePath }}
            - name: PV_MIGRATE_POSIX_REMOTE_PATH
              value: {{ .Values.rclone.posixMetadataRemotePath | quote }}
            - name: PV_MIGRATE_LOCAL_PATH
              value: {{ .Values.rclone.posixMetadataLocalPath | quote }}
            {{- end }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.rclone.securityContext | nindent 12 }}
          image: "{{ .Values.rclone.image.repository }}:{{ .Values.rclone.image.tag }}"
          imagePullPolicy: {{ .Values.rclone.image.pullPolicy }}
          resources:
            {{- toYaml .Values.rclone.resources | nindent 12 }}
          volumeMounts:
            {{- range $index, $mount := .Values.rclone.pvcMounts }}
            - mountPath: {{ $mount.mountPath }}
              name: vol-{{ $index }}
              readOnly: {{ default false $mount.readOnly }}
            {{- end }}
            {{- if .Values.rclone.configMount }}
            - mountPath: {{ .Values.rclone.configMountPath }}
              name: rclone-config
              subPath: rclone.conf
            {{- end }}
      {{- with .Values.rclone.nodeName }}
      nodeName: {{ . }}
      {{- end }}
      {{- with .Values.rclone.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.rclone.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.rclone.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        {{- range $index, $mount := .Values.rclone.pvcMounts }}
        - name: vol-{{ $index }}
          persistentVolumeClaim:
            claimName: {{ required ".Values.rclone.pvcMounts[*].name is required!" $mount.name }}
            readOnly: {{ default false $mount.readOnly }}
        {{- end }}
        {{- if .Values.rclone.configMount }}
        - name: rclone-config
          secret:
            secretName: {{ include "pv-migrate.fullname" . }}-rclone
            defaultMode: 0400
        {{- end }}
{{- end }}
