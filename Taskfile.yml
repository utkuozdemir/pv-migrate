version: "3"

tasks:
  fmt:
    desc: format code
    vars:
      MODULE:
        sh: head -n 1 go.mod | cut -d' ' -f2
    cmds:
      - go mod tidy
      - go fix ./...
      - golangci-lint run --fix ./...
      - golangci-lint fmt ./...
      - shfmt -l -i 2 -ci -sr -w .

  lint:
    desc: lint code
    cmds:
      - go mod tidy --diff
      - golangci-lint run ./...
      - helm lint internal/helm/pv-migrate
      - shfmt -l -i 2 -ci -sr .
      - task: lint:release

  lint:release:
    desc: validate the release configuration
    cmds:
      - goreleaser check

  test:
    desc: run the unit tests
    cmds:
      - go test ./...

  test:integration:
    desc: run the migration integration tests against the current kube context
    cmds:
      - go test -tags integration -timeout 30m -v ./integration/ -run TestMigrate

  # `task test` already replays every fuzz target's seed corpus, which is where
  # the regression value sits. This drives the actual search instead, one target
  # at a time because -fuzz only ever fuzzes one. A discovered failure is written
  # to the package's testdata/fuzz directory, so it lands in the working tree.
  test:fuzz:
    desc: search for new fuzz failures (FUZZTIME=30s per target)
    vars:
      FUZZTIME: '{{.FUZZTIME | default "30s"}}'
    cmds:
      - |
        set -eu
        for pkg in $(go list ./...); do
          # a listing failure means the package does not compile, which has to
          # surface rather than read as "no fuzz targets here"
          listed="$(go test -list 'Fuzz' "$pkg")"
          for target in $(printf '%s\n' "$listed" | grep '^Fuzz' || true); do
            echo "==> $pkg $target ({{.FUZZTIME}})"
            go test "$pkg" -run '^$' -fuzz "^${target}\$" -fuzztime '{{.FUZZTIME}}'
          done
        done

  clean:
    desc: clean
    cmds:
      - rm -rf {{.ROOT_DIR}}/dist/

  generate-all:
    desc: update all generated files
    cmds:
      - task: generate-cli-reference
      - task: generate-helm-chart-docs

  generate-cli-reference:
    desc: update generated CLI reference docs
    env:
      ROOT_USAGE:
        sh: go run ./cmd/pv-migrate --help
      BACKUP_USAGE:
        sh: go run ./cmd/pv-migrate backup --help
      RESTORE_USAGE:
        sh: go run ./cmd/pv-migrate restore --help
      STATUS_USAGE:
        sh: go run ./cmd/pv-migrate status --help
      CLEANUP_USAGE:
        sh: go run ./cmd/pv-migrate cleanup --help
      COMPLETION_USAGE:
        sh: go run ./cmd/pv-migrate completion --help
    cmds:
      - mkdir -p {{.ROOT_DIR}}/docs
      - >-
        docker run --rm -v {{.ROOT_DIR}}:/project
        -e ROOT_USAGE -e BACKUP_USAGE -e RESTORE_USAGE -e STATUS_USAGE -e CLEANUP_USAGE -e COMPLETION_USAGE
        hairyhenderson/gomplate:stable
        --file /project/docs/cli-reference.md.gotmpl
        --out /project/docs/cli-reference.md

  generate-helm-chart-docs:
    desc: update generated helm chart docs
    vars:
      # renovate: depName=norwoodj/helm-docs datasource=github-releases
      HELM_DOCS_VERSION: v1.14.2
    cmd: >-
        docker run --rm -v {{.ROOT_DIR}}:/helm-docs
        jnorwood/helm-docs:{{.HELM_DOCS_VERSION}}
        --chart-search-root /helm-docs/internal/helm

  build:
    desc: build
    cmds:
      - goreleaser build --snapshot --clean --single-target

  release:
    desc: release
    vars:
      NUM_LAST_TAGS: 3
      LAST_TAGS:
        sh: git tag --sort=-version:refname | head -n {{.NUM_LAST_TAGS}} | xargs echo
      NEXT_TAG:
        sh: svu next
    cmds:
      - "echo Last {{.NUM_LAST_TAGS}} tags: {{.LAST_TAGS}}"
      - "echo Next tag: {{.NEXT_TAG}}"
      - git tag -a {{.NEXT_TAG}} -m "{{.NEXT_TAG}}"
      - git push origin {{.NEXT_TAG}}
