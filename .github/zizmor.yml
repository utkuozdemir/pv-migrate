# zizmor audits the workflows and the composite action in `task lint`. An
# exception listed here carries its reason, because the audit is otherwise right.
rules:
  artipacked:
    # the recording job pushes a branch with the recordings, so its checkout has
    # to keep the credentials
    ignore:
      - demo.yml
  cache-poisoning:
    # the build job publishes nothing: its goreleaser run is a snapshot build
    # that checks the packaging, so a poisoned cache can reach no release.
    # The release build itself runs without a cache.
    ignore:
      - build.yml
