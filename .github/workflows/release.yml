---
name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euox pipefail {0}

jobs:
  # Both publishing jobs below wait for this one, so nothing is built or
  # published from a tag that fails these checks.
  verify-tag:
    runs-on: ubuntu-24.04
    steps:
      # the release tag must carry a signature GitHub verifies against the
      # pusher's registered keys (any type: SSH, GPG or S/MIME)
      - name: Check that the release tag is signed, verified and bound to this build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}")"
          if [ "$(jq -r .object.type <<<"${ref}")" != "tag" ]; then
            echo "release tag ${GITHUB_REF_NAME} is a lightweight tag; releases need an annotated, signed tag" >&2
            exit 1
          fi
          tag="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/$(jq -r .object.sha <<<"${ref}")")"
          # the signed object must name this tag and point at the commit this
          # run builds, so a re-pointed ref cannot reuse another tag's signature
          if [ "$(jq -r .tag <<<"${tag}")" != "${GITHUB_REF_NAME}" ]; then
            echo "the signed tag object is named '$(jq -r .tag <<<"${tag}")', not ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          if [ "$(jq -r .object.type <<<"${tag}")" != "commit" ] || [ "$(jq -r .object.sha <<<"${tag}")" != "${GITHUB_SHA}" ]; then
            echo "the signed tag points at $(jq -r .object.sha <<<"${tag}"), this run builds ${GITHUB_SHA}" >&2
            exit 1
          fi
          if [ "$(jq -r .verification.verified <<<"${tag}")" != "true" ]; then
            echo "release tag ${GITHUB_REF_NAME} has no verified signature: $(jq -r .verification.reason <<<"${tag}")" >&2
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} carries a verified signature and points at ${GITHUB_SHA}"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check that the released commit is on main
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "commit ${GITHUB_SHA} is not on main; releases are cut from main only" >&2
            exit 1
          fi

  release:
    runs-on: ubuntu-24.04
    needs: verify-tag
    # the release environment holds the publishing secrets. It admits only v*
    # tags and waits for the maintainer's approval, so a workflow on any other
    # ref, or a tag pushed with a leaked token, cannot read them. The tag
    # pattern alone would not be a boundary: a pushed tag brings its own
    # workflow definition.
    environment: release
    permissions:
      contents: write # create the GitHub release
      packages: write # push the image to GHCR
      id-token: write # cosign keyless signing (OIDC)
    outputs:
      docker_io: ${{ steps.images.outputs.docker_io }}
      ghcr_io: ${{ steps.images.outputs.ghcr_io }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # to be able to generate the full changelog:
          # https://github.com/goreleaser/goreleaser-action/issues/56#issuecomment-568718162
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: utkuozdemir
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # renovate: depName=sigstore/cosign datasource=github-releases
          cosign-release: v3.1.3
      # the goreleaser version is declared once, in hack/dev.Dockerfile, so the
      # version that validates the release config in lint is the version that
      # performs the release. Fail loudly rather than guessing if that
      # declaration ever stops being exactly one line.
      - name: Resolve goreleaser version
        id: goreleaser_version
        run: |
          found="$(grep -E '^ARG GORELEASER_VERSION=' hack/dev.Dockerfile || true)"
          count="$(printf '%s' "${found}" | grep -c . || true)"
          if [ "${count}" != "1" ]; then
            echo "expected exactly one ARG GORELEASER_VERSION in hack/dev.Dockerfile, found ${count}" >&2
            exit 1
          fi
          version="${found#ARG GORELEASER_VERSION=}"
          if ! printf '%s' "${version}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ARG GORELEASER_VERSION is not a pinned version: ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >>"${GITHUB_OUTPUT}"
      # goreleaser also signs the checksums file here, keyless with cosign,
      # see .goreleaser.yml
      - name: GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: ${{ steps.goreleaser_version.outputs.version }}
          args: release --clean
        env:
          # the tag this run is for, in case another tag lands on the same commit
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRIVATE_ACCESS_TOKEN: ${{ secrets.PRIVATE_ACCESS_TOKEN }}
      # also when goreleaser failed at a late step (a package manager), after
      # the release and the image were already published: what is out there
      # still gets signed and attested
      - name: Sign the CLI image
        id: images
        if: ${{ !cancelled() }}
        run: |
          for repo in \
            docker.io/utkuozdemir/pv-migrate \
            ghcr.io/utkuozdemir/pv-migrate; do
            # the tag was just pushed, so the registry read is retried to avoid a race
            digest=""
            for _ in 1 2 3 4 5; do
              if digest="$(docker buildx imagetools inspect "${repo}:${GITHUB_REF_NAME}" \
                --format '{{ .Manifest.Digest }}')"; then
                break
              fi
              sleep 5
            done
            if [ -z "${digest}" ]; then
              echo "could not resolve a digest for ${repo}:${GITHUB_REF_NAME}" >&2
              exit 1
            fi
            cosign sign --yes "${repo}@${digest}"
            # hand the digest to the attestation job below
            key="$(printf '%s' "${repo%%/*}" | tr -c 'a-zA-Z0-9_' '_')"
            echo "${key}=${digest}" >>"${GITHUB_OUTPUT}"
          done
      # the checksums list feeds the attestation job, which must be able to
      # run again on its own if the attestation service has a bad moment
      - name: Upload the checksums for attestation
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checksums
          path: dist/checksums.txt
          if-no-files-found: error

  # build provenance for every archive and for the CLI image digests: a
  # signed statement tying each digest to this repository, commit, workflow
  # and run. A separate job, after publishing and signing, so that a failure
  # here never leaves a published release unsigned and can be retried without
  # redoing the release. The images' attestations are stored in GitHub's
  # attestation store, not pushed to the registries: that is what
  # `gh attestation verify` reads, and GHCR does not serve the referrers API.
  attest:
    runs-on: ubuntu-24.04
    needs: release
    # whenever the image was signed, even if the release job then failed at a
    # package manager step
    if: ${{ !cancelled() && needs.release.outputs.docker_io != '' }}
    permissions:
      id-token: write
      attestations: write
    steps:
      - name: Download the checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: checksums
      - name: Attest the release files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: checksums.txt
      - name: Attest the Docker Hub image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: docker.io/utkuozdemir/pv-migrate
          subject-digest: ${{ needs.release.outputs.docker_io }}
      - name: Attest the GHCR image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/utkuozdemir/pv-migrate
          subject-digest: ${{ needs.release.outputs.ghcr_io }}

  # rebuild the release files from the tag on a second runner and compare
  # them with what was just published. Identical means this release is
  # reproducible, shown by a second machine. A difference fails this job
  # loudly and leaves the published release alone
  verify-reproducible:
    runs-on: ubuntu-24.04
    needs: release
    # also when the release job failed after publishing (e.g. at a package
    # manager step): what is published still gets checked
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    steps:
      # first, so that a run whose release never got published stops here.
      # Outside the workspace: the checkout below cleans the workspace and
      # would delete the download
      - name: Download the published checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" --pattern checksums.txt --output "${RUNNER_TEMP}/published-checksums.txt"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # no cache: the point of this job is to rebuild from scratch on a
          # runner that shares nothing with the release build. The cache key
          # is only the go.sum hash, so the release job's compiled packages
          # would otherwise be restored here and the comparison would only
          # cover the packaging
          cache: false
      - name: Resolve goreleaser version
        id: goreleaser_version
        run: echo "version=$(sed -n 's/^ARG GORELEASER_VERSION=//p' hack/dev.Dockerfile)" >>"${GITHUB_OUTPUT}"
      - name: Rebuild the release files
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: ${{ steps.goreleaser_version.outputs.version }}
          args: release --clean --skip=publish,sign,sbom,docker,announce
        env:
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          PRIVATE_ACCESS_TOKEN: placeholder
      - name: Compare with the published checksums
        run: |
          if diff "${RUNNER_TEMP}/published-checksums.txt" dist/checksums.txt; then
            echo "release ${GITHUB_REF_NAME} reproduced byte for byte on a second runner"
          else
            echo "release ${GITHUB_REF_NAME} did not reproduce: the artifacts above differ from the published ones, see the rebuilt-release-files artifact of this run" >&2
            exit 1
          fi
      # the whole rebuilt dist, so a difference can be diffed against the
      # published files without rebuilding anything. artifacts.json in there
      # records the file info goreleaser applied to every entry. Only when a
      # rebuild exists, a run whose release was never published stops earlier
      - name: Keep the rebuilt files for inspection
        if: failure() && hashFiles('dist/checksums.txt') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rebuilt-release-files
          path: dist
          retention-days: 7

  # Its own job rather than a step after the release, because it can only run
  # once the release exists and it fails for reasons of its own. As a step, the
  # only way to retry it was to run the release again, which refuses to upload
  # archives that are already there and so never reached this. As a job it is
  # re-run on its own.
  krew:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update new version in krew-index
        uses: rajatjindal/krew-release-bot@c970b8a8f6dbc2f2285a26e3ae160903b87002c3 # v0.0.51
        env:
          # Undocumented, and the difference between sixty requests an hour
          # shared with every other job on the runner's address and the token's
          # own budget. Without it the bot reads the release anonymously, which
          # is what ran out mid-release.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The data mover images. Built next to the CLI rather than after it: the
  # CLI stamps this tag into the chart values it installs, so a release that
  # publishes one without the other leaves the CLI pulling a tag that does
  # not exist. Each image is signed and attested in its own matrix job, by
  # digest, which is the same digest on both registries.
  release-images:
    runs-on: ubuntu-24.04
    needs: verify-tag
    environment: release
    permissions:
      contents: read
      packages: write # push the images to GHCR
      id-token: write # cosign keyless signing and the attestations (OIDC)
      attestations: write
    strategy:
      matrix:
        image:
          - name: pv-migrate-rsync
            context: ./docker/rsync/
          - name: pv-migrate-sshd
            context: ./docker/sshd/
          - name: pv-migrate-rclone
            context: ./docker/rclone/
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: utkuozdemir
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # renovate: depName=sigstore/cosign datasource=github-releases
          cosign-release: v3.1.3
      - name: Determine tags
        id: tags
        run: |
          TAGS="docker.io/utkuozdemir/${{ matrix.image.name }}:${{ github.ref_name }}"
          TAGS="${TAGS},ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}:${{ github.ref_name }}"
          if [[ "${{ github.ref_name }}" != *-* ]]; then
            TAGS="${TAGS},docker.io/utkuozdemir/${{ matrix.image.name }}:latest"
            TAGS="${TAGS},ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
      # buildkit's own provenance and SBOM attestations are off: GitHub's
      # build provenance is attached below instead, and one kind of
      # attestation is enough to verify
      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.image.context }}
          platforms: linux/amd64,linux/arm,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.tags.outputs.tags }}
      - name: Sign the image
        run: |
          cosign sign --yes "docker.io/utkuozdemir/${{ matrix.image.name }}@${{ steps.build.outputs.digest }}"
          cosign sign --yes "ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}@${{ steps.build.outputs.digest }}"
      - name: Attest the Docker Hub image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: docker.io/utkuozdemir/${{ matrix.image.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
      - name: Attest the GHCR image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
