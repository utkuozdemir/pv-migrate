name: demo

# Re-records the README demos and opens a pull request with the result, so the
# recordings can be refreshed from the GitHub UI without a checkout, a cluster
# or a local vhs. Nothing triggers it automatically. Each run records a real
# migration, with its own timestamps and generated names, so a scheduled one
# would commit another megabyte of GIF showing nothing new.
on:
  workflow_dispatch:
    inputs:
      open_pull_request:
        description: "Open a pull request with the regenerated recordings"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  record:
    name: record
    runs-on: ubuntu-24.04
    permissions:
      contents: write # push the branch with the recordings
      pull-requests: write # open the pull request
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: demo
          # renovate: depName=kubernetes-sigs/kind datasource=github-releases
          version: v0.33.0

      # The recording steps live in the Taskfile, the same ones a maintainer
      # runs locally. Only the recorder differs. VHS runs from its own image
      # rather than being installed on the runner, because that image carries
      # the fonts, including the colour emoji the tool prints, which a bare
      # runner may not have. Host networking lets it reach the kind cluster's
      # API server on the runner's loopback, and the binary is mounted onto a
      # directory already on PATH, which is all the tape needs.
      - name: Record
        env:
          # renovate: depName=charmbracelet/vhs datasource=docker
          VHS_IMAGE: ghcr.io/charmbracelet/vhs:v0.11.0
        run: |
          task demo:record VHS="docker run --rm --network host -v ${PWD}:/vhs -v ${PWD}/dist/demo/pv-migrate:/usr/local/bin/pv-migrate -v ${HOME}/.kube:/root/.kube -e KUBECONFIG=/root/.kube/config ${VHS_IMAGE}"

      - name: Upload the recordings
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: demo-recordings
          path: img/demo*.gif

      - name: Open a pull request
        if: inputs.open_pull_request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- img; then
            echo "the recordings did not change, nothing to open"
            exit 0
          fi

          branch="demo-recordings-${{ github.run_id }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${branch}"
          git commit -s -m "docs: re-record the README demos" -m \
            "Regenerated by the demo workflow from the tape files in demo/, against a throwaway cluster. Run ${{ github.run_id }}." \
            -- img
          git push origin "${branch}"

          # Based on whatever ref was dispatched rather than the default
          # branch. A run from a feature branch should propose its recordings
          # back to that branch, instead of opening one that carries every
          # commit on it.
          gh pr create \
            --title "docs: re-record the README demos" \
            --body "Regenerated by the [demo workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). Review the images in the diff, then merge or close." \
            --base "${{ github.ref_name }}" \
            --head "${branch}"
